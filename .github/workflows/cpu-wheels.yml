name: CPU native platform wheels

on:
  push:
    branches: [codex/qwen-cpu-public-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CPU ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
            python: .ci-venv/bin/python
            macos_target: ""
          - runner: windows-2022
            platform: windows-x86_64
            python: .ci-venv/Scripts/python.exe
            macos_target: ""
          - runner: macos-15-intel
            platform: macos-x86_64
            python: .ci-venv/bin/python
            macos_target: "13.0"
          - runner: macos-15
            platform: macos-arm64
            python: .ci-venv/bin/python
            macos_target: "11.0"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: KoljaB/qwentts.cpp
          ref: b47728bd6cb60331bd02afacb390e533479329b5
          path: third_party/qwentts.cpp
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build tools
        run: python -m pip install --upgrade pip build wheel pytest numpy huggingface-hub cmake ninja twine
      - name: Linux repair tools
        if: runner.os == 'Linux'
        run: python -m pip install auditwheel patchelf
      - name: Windows repair tools
        if: runner.os == 'Windows'
        run: python -m pip install delvewheel
      - name: macOS repair tools
        if: runner.os == 'macOS'
        run: python -m pip install delocate
      - name: Build qualified CPU source
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=("--cmake-arg=-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET")
          fi
          python scripts/build_native.py --source third_party/qwentts.cpp --backend cpu --clean --jobs 2 --cmake-arg=-G --cmake-arg=Ninja "${args[@]}"
      - name: Focused native tests
        run: |
          PYTHONPATH=src python -m pytest -q -p no:cacheprovider tests/test_binding.py tests/test_runtime_loader.py tests/test_cli.py tests/test_packaging.py tests/test_build_native.py
      - name: Build immutable distributions
        run: python -m build --wheel --sdist --outdir dist
      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        run: python -m auditwheel repair --only-plat --plat manylinux_2_35_x86_64 --wheel-dir wheelhouse dist/*.whl
      - name: Repair Windows wheel
        if: runner.os == 'Windows'
        run: python -m delvewheel repair --analyze-existing --ignore-existing --add-path src/qwentts_cpp_cpu/lib --wheel-dir wheelhouse dist/*.whl
      - name: Repair macOS wheel
        if: runner.os == 'macOS'
        run: delocate-wheel --require-archs "$(uname -m)" -w wheelhouse dist/*.whl
      - name: Fresh install and actual speech
        run: |
          python -m venv .ci-venv
          "${{ matrix.python }}" -m pip install --upgrade pip
          wheels=(wheelhouse/*.whl)
          test "${#wheels[@]}" -eq 1
          "${{ matrix.python }}" -m pip install "${wheels[0]}"
          "${{ matrix.python }}" -m pip check
          "${{ matrix.python }}" scripts/ci_cpu_synthesis.py --sample samples/pr-wheel-audio/cpu_greedy_20f_customvoice_bf16.wav --cache-dir model-cache
      - name: Check artifact metadata
        run: python -m twine check --strict wheelhouse/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: cpu-${{ matrix.platform }}
          path: |
            wheelhouse/*.whl
            cpu-smoke.json
            cpu-smoke.wav
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: cpu-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

# Publication deliberately lives outside Actions: tools/release_guard.py publish
# requires fresh signed runtime evidence and matching immutable artifact hashes.
