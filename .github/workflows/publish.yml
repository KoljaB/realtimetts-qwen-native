name: Publish

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      qwentts_ref:
        description: qwentts.cpp commit, tag, or branch to build
        required: true
        default: 7b6ed4f6db964c14fd3ac36c1ca13f1ce6150f4e

permissions:
  contents: read

jobs:
  build-wheels:
    name: Linux ${{ matrix.arch }} CUDA 12.8 wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            cuda_repo_distro: ubuntu2204
            cuda_repo_arch: x86_64
            cuda_package_suffix: "12-8"
            cuda_home: /usr/local/cuda-12.8
            cuda_architectures: 75-virtual;86-real;90-real;120-real;120-virtual
            manylinux_platform: manylinux_2_35_x86_64
            build_jobs: "2"
          - arch: aarch64
            runner: ubuntu-22.04-arm
            cuda_repo_distro: ubuntu2204
            cuda_repo_arch: sbsa
            cuda_package_suffix: "12-8"
            cuda_home: /usr/local/cuda-12.8
            cuda_architectures: 75-virtual;86-real;90-real;120-real;120-virtual
            manylinux_platform: manylinux_2_35_aarch64
            build_jobs: "2"
    env:
      QWENTTS_CPP_BACKEND: cuda
      QWENTTS_CPP_BUILD_JOBS: ${{ matrix.build_jobs }}
      QWENTTS_CPP_WHEEL_BUILD_TAG: 1cu128
      QWENTTS_REF: ${{ inputs.qwentts_ref || '7b6ed4f6db964c14fd3ac36c1ca13f1ce6150f4e' }}
      CUDA_ARCHITECTURES: ${{ matrix.cuda_architectures }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get clean

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip auditwheel build wheel
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build patchelf wget ca-certificates

      - name: Install CUDA toolkit
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda_repo_distro }}/${{ matrix.cuda_repo_arch }}/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-${{ matrix.cuda_package_suffix }} \
            cuda-cudart-dev-${{ matrix.cuda_package_suffix }} \
            libcublas-dev-${{ matrix.cuda_package_suffix }}
          echo "${{ matrix.cuda_home }}/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=${{ matrix.cuda_home }}" >> "$GITHUB_ENV"
          echo "CMAKE_CUDA_COMPILER=${{ matrix.cuda_home }}/bin/nvcc" >> "$GITHUB_ENV"

      - name: Fetch qwentts.cpp
        run: |
          git clone --recursive https://github.com/ServeurpersoCom/qwentts.cpp third_party/qwentts.cpp
          git -C third_party/qwentts.cpp checkout "$QWENTTS_REF"
          git -C third_party/qwentts.cpp submodule update --init --recursive

      - name: Build wheel
        run: |
          python scripts/build_native.py \
            --source third_party/qwentts.cpp \
            --backend cuda \
            --clean \
            --cmake-arg=-G \
            --cmake-arg=Ninja \
            --cmake-arg="-DCMAKE_CUDA_ARCHITECTURES=$CUDA_ARCHITECTURES"
          python -m build --wheel
          mkdir -p wheelhouse
          python -m auditwheel repair \
            --plat ${{ matrix.manylinux_platform }} \
            --exclude libcudart.so.12 \
            --exclude libcublas.so.12 \
            --exclude libcublasLt.so.12 \
            --exclude libcuda.so.1 \
            -w wheelhouse \
            dist/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build-windows-wheel:
    name: Windows x64 CUDA 12.8 wheel
    runs-on: windows-2022
    env:
      QWENTTS_CPP_BACKEND: cuda
      QWENTTS_CPP_BUILD_JOBS: "2"
      QWENTTS_CPP_WHEEL_BUILD_TAG: 1cu128
      QWENTTS_REF: ${{ inputs.qwentts_ref || '7b6ed4f6db964c14fd3ac36c1ca13f1ce6150f4e' }}
      # Keep native sm_75 for the RTX 2080-class latency target. The matching
      # PTX image preserves forward compatibility without pushing this wheel
      # toward PyPI's per-file size limit.
      CUDA_ARCHITECTURES: 75-real;75-virtual
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Install build tools
        run: python -m pip install --upgrade pip build cmake delvewheel ninja wheel

      - name: Fetch qwentts.cpp
        shell: pwsh
        run: |
          git clone --recursive https://github.com/ServeurpersoCom/qwentts.cpp third_party/qwentts.cpp
          git -C third_party/qwentts.cpp checkout "$env:QWENTTS_REF"
          git -C third_party/qwentts.cpp submodule update --init --recursive

      - name: Build and repair wheel
        shell: pwsh
        env:
          CUDACXX: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}\bin\nvcc.exe
        run: |
          python scripts/build_native.py `
            --source third_party/qwentts.cpp `
            --backend cuda `
            --clean `
            --cmake-arg=-G `
            --cmake-arg=Ninja `
            --cmake-arg="-DCMAKE_CUDA_ARCHITECTURES=$env:CUDA_ARCHITECTURES"
          python -m build --wheel
          python -m delvewheel repair `
            --analyze-existing `
            --ignore-existing `
            --add-path "$env:CUDA_PATH\bin;$env:CUDA_PATH\bin\x64;src\qwentts_cpp\lib" `
            --exclude "cudart64_12.dll;cublas64_12.dll;cublasLt64_12.dll;nvcuda.dll" `
            --wheel-dir wheelhouse `
            dist\*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-windows-x86_64
          path: wheelhouse/*.whl

  check:
    name: Check distributions
    needs:
      - build-wheels
      - build-windows-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Check package metadata
        run: |
          python -c "from pathlib import Path; limit=104857600; wheels=list(Path('dist').glob('*.whl')); oversized=[(p.name, p.stat().st_size) for p in wheels if p.stat().st_size > limit]; assert wheels and not oversized, f'wheel missing or exceeds PyPI 100 MiB limit: {oversized}'"
          uvx twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/realtimetts-qwen-native/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
