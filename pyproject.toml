[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtimetts-qwen-native-cpu"
version = "0.3.0rc1"
description = "Portable CPU-only native qwentts.cpp bindings for RealtimeTTS"
readme = "README.md"
license = "MIT"
authors = [{ name = "Andres Marafioti" }, { name = "Kolja Beigel" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "huggingface-hub",
]
optional-dependencies.test = [
    "pytest>=8",
    "tomli>=2; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/KoljaB/RealtimeTTS"
Repository = "https://github.com/KoljaB/RealtimeTTS"
Upstream = "https://github.com/andimarafioti/qwentts-cpp-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwentts_cpp_cpu = ["py.typed", "lib/*"]

[tool.qwentts-cpp-python]
qwentts-ref = "b47728bd6cb60331bd02afacb390e533479329b5"
qwentts-abi = 5

[tool.cibuildwheel]
build = "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
skip = "*-musllinux_* *-manylinux_i686"
before-build = "python scripts/build_native.py --backend cpu --clean"
test-command = "python -c \"from qwentts_cpp_cpu import QwenLibrary; print(QwenLibrary().version())\""

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
